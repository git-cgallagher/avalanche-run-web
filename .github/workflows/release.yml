# Push a tag like v0.4.0 (matching package.json and src-tauri/tauri.conf.json) to publish a GitHub release
# with the macOS DMG, the Windows installer and a zip of the browser build.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - platform: macos
            runner: macos-15
            args: --target universal-apple-darwin --bundles dmg
            files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - platform: windows
            runner: windows-2025
            args: --bundles nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Check tag matches versions
        shell: bash
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [[ "$GITHUB_REF_NAME" == "v$PKG" && "$PKG" == "$CONF" ]] || { echo "tag $GITHUB_REF_NAME, package.json $PKG, tauri.conf.json $CONF"; exit 1; }
      - name: Rust targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - name: Build installer
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # create the release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Browser build zip
        run: |
          set -euo pipefail
          npm ci
          npm run build
          (cd dist && zip -qr "../AvalancheRun-web-${GITHUB_REF_NAME#v}.zip" .)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: installers
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Notes are this version's CHANGELOG section.
          awk -v v="$VERSION" '/^## /{p = index($0, "## " v " ") == 1} p' CHANGELOG.md | tail -n +2 > notes.md
          gh release create "$GITHUB_REF_NAME" installers/* "AvalancheRun-web-$VERSION.zip" \
            --title "Avalanche Run $VERSION" --notes-file notes.md
